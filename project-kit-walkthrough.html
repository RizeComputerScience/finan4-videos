<script>
  const cues = "WEBVTT\n\n00:00:00.000 --> 00:00:03.670\nFilling in your project kit, the draft steps.\n\n00:00:04.700 --> 00:00:06.010\nThis is the kit for Cragmoor,\n\n00:00:06.660 --> 00:00:08.530\na made-up chain of climbing gyms.\n\n00:00:09.500 --> 00:00:12.730\nYour company's kit has the same rows in the same places.\n\n00:00:13.700 --> 00:00:15.530\nThe grey cells are numbers from\n\n00:00:15.580 --> 00:00:17.850\nthe company's reports filled in for you.\n\n00:00:18.620 --> 00:00:20.190\nThe yellow cells are yours.\n\n00:00:21.280 --> 00:00:22.490\nNext to every yellow cell,\n\n00:00:23.120 --> 00:00:25.650\ncolumn C tells you which cells to use.\n\n00:00:26.400 --> 00:00:29.650\nStep one, builds one full year of cash flow for\n\n00:00:29.700 --> 00:00:34.310\none new gym. The first yellow cell is the cash profit before tax.\n\n00:00:35.140 --> 00:00:37.330\nColumn C says revenue times cash margin,\n\n00:00:37.960 --> 00:00:43.290\nso I'll type equals B52 times B53 and press Enter.\n\n00:00:44.280 --> 00:00:45.730\nThat's 1.7 million.\n\n00:00:46.640 --> 00:00:49.410\nI'll fill in the next four rows the same way,\n\n00:00:49.780 --> 00:00:51.250\nreading column C each time.\n\n00:00:52.060 --> 00:00:56.130\nA full year's cash flow comes to about 1.21 million.\n\n00:00:56.880 --> 00:00:58.690\nThe last cell is year zero.\n\n00:00:58.740 --> 00:01:00.590\nThe cost to open the gym.\n\n00:01:01.380 --> 00:01:02.490\nThat's money going out,\n\n00:01:02.640 --> 00:01:04.270\nso I'll type it as a negative number.\n\n00:01:04.960 --> 00:01:06.710\nUnder every step, there's a check row.\n\n00:01:07.640 --> 00:01:08.670\nWhen every cell is right,\n\n00:01:08.820 --> 00:01:09.770\nit shows a check mark.\n\n00:01:10.420 --> 00:01:11.270\nIf a cell is wrong,\n\n00:01:11.600 --> 00:01:13.090\nit tells you which one to fix.\n\n00:01:13.760 --> 00:01:14.950\nStep two is the hurdle rate,\n\n00:01:15.020 --> 00:01:18.310\nworked in dollars, the same way as the food trucks.\n\n00:01:18.740 --> 00:01:22.730\nThe owner's stake is the number of shares times today's share price.\n\n00:01:23.220 --> 00:01:26.070\nThe return the owners expect is the treasury rate\n\n00:01:26.120 --> 00:01:28.830\nplus beta times the market premium.\n\n00:01:30.100 --> 00:01:32.530\nThen come the dollars a year for lenders,\n\n00:01:33.140 --> 00:01:34.790\nthe dollars a year for owners,\n\n00:01:35.020 --> 00:01:36.130\nand the hurdle rate,\n\n00:01:36.720 --> 00:01:40.110\nwhich is the total dollars divided by all the money put in.\n\n00:01:40.700 --> 00:01:43.550\nFor Cragmoor, that's 9.4 percent.\n\n00:01:43.940 --> 00:01:46.740\nIn step three, the year table fills itself in\n\n00:01:46.790 --> 00:01:49.590\nfrom your step one and step two cells.\n\n00:01:50.680 --> 00:01:54.590\nEach year's cash flow is brought back to today at your hurdle rate.\n\n00:01:54.640 --> 00:02:00.810\nYou type one formula equals sum of the present value column.\n\n00:02:02.120 --> 00:02:04.810\nCragmoor's NPV is 1.91 million.\n\n00:02:05.600 --> 00:02:06.310\nIt's above zero.\n\n00:02:06.840 --> 00:02:08.130\nSo on these numbers,\n\n00:02:08.360 --> 00:02:09.850\none new gym is worth building.\n\n00:02:10.700 --> 00:02:14.310\nStep four asks how wrong these numbers could be.\n\n00:02:15.240 --> 00:02:17.330\nThe base case is filled in for you.\n\n00:02:17.880 --> 00:02:20.790\nYou choose a worst case and a best case for each input,\n\n00:02:20.840 --> 00:02:24.350\nand each choice should come from something in your fact sheet.\n\n00:02:25.380 --> 00:02:27.750\nCragmoor's newer gyms earned between 4.3\n\n00:02:27.800 --> 00:02:30.170\nmillion and 5.6 million a year.\n\n00:02:30.680 --> 00:02:32.030\nSo I'll use those for revenue.\n\n00:02:32.540 --> 00:02:36.390\nAs I type, the kit works out the NPV of each case.\n\n00:02:36.960 --> 00:02:40.050\nIn my worst case, the gym loses 2.15 million.\n\n00:02:40.740 --> 00:02:43.930\nIn my best case, it adds 5.47 million.\n\n00:02:44.700 --> 00:02:47.630\nThat range is what your draft memo is about.\n\n00:02:48.240 --> 00:02:51.370\nThe NPV, your worst and best cases, and\n\n00:02:51.420 --> 00:02:53.630\nwhat would have to be true for your answer to change.\n";
