  const cues = "WEBVTT\n\n00:00:00.000 --> 00:00:03.500\nWhy Bond Prices Fall\nWhen Interest Rates Rise\n\n00:00:04.070 --> 00:00:08.540\nIn 2022, Dick's Sporting Goods\nborrowed money by selling bonds,\n\n00:00:08.850 --> 00:00:11.620\nand it has made every\npayment since on time.\n\n00:00:12.330 --> 00:00:15.980\nBut by January 2026, each $1,000 of\n\n00:00:16.030 --> 00:00:19.680\nthose bonds was worth only $920.91.\n\n00:00:20.590 --> 00:00:21.360\nLet's see why.\n\n00:00:23.030 --> 00:00:24.540\nWe'll start with a simpler bond.\n\n00:00:25.310 --> 00:00:29.120\nSay you lend a company\n$1,000 for five years at 5%.\n\n00:00:29.850 --> 00:00:34.860\nEvery year, it pays you 5%\nof $1,000, which is $50.\n\n00:00:35.790 --> 00:00:37.460\nThat payment is called the coupon.\n\n00:00:38.450 --> 00:00:41.480\nAt the end of the five years,\nyou get your $1,000 back.\n\n00:00:42.030 --> 00:00:43.480\nThat's the bond's face value.\n\n00:00:45.090 --> 00:00:47.560\nNow, suppose interest\nrates rise, and companies\n\n00:00:47.610 --> 00:00:50.080\nhave to pay 6% to borrow.\n\n00:00:50.410 --> 00:00:54.980\nThat 6% is the market rate,\nthe rate lenders want today.\n\n00:00:55.030 --> 00:00:58.300\nA new $1,000 bond pays $60 a year\n\n00:00:58.350 --> 00:01:01.620\nand repays the same $1,000 in the end.\n\n00:01:03.063 --> 00:01:05.013\nLet's say you need your money now, so\n\n00:01:05.063 --> 00:01:07.013\nyou're looking for\nsomeone to buy your bond.\n\n00:01:07.783 --> 00:01:10.193\nAny buyer will ask the same question.\n\n00:01:10.963 --> 00:01:14.503\nWhy pay $1,000 for $50\na year when $1,000 buys\n\n00:01:14.553 --> 00:01:18.093\na brand new bond that pays $60 a year?\n\n00:01:18.703 --> 00:01:23.653\nWith your bond, she'll get $10\nless every year for five years.\n\n00:01:23.840 --> 00:01:26.770\nSo, you'll have to take the\nshortfall off the price.\n\n00:01:27.680 --> 00:01:30.450\nIt comes to a little less than $50 because\n\n00:01:30.500 --> 00:01:33.270\nmoney that arrives later\nis worth less today.\n\n00:01:34.100 --> 00:01:39.730\nAt 6%, the $10 she misses next\nyear is worth $9.43 today.\n\n00:01:40.600 --> 00:01:47.190\nThe one after that is worth $8.90,\nthen $8.40, $7.92, and $7.47.\n\n00:01:47.900 --> 00:01:50.390\nTogether, that's $42.12.\n\n00:01:51.440 --> 00:02:00.050\nSo, your bond sells for $1,000\nminus $42.12, which is $957.88.\n\n00:02:01.060 --> 00:02:03.820\nAt that price, your old bond earns its\n\n00:02:03.870 --> 00:02:06.630\nbuyer 6%, the same as the new one.\n\n00:02:07.370 --> 00:02:08.660\nIt works the other way, too.\n\n00:02:09.670 --> 00:02:13.060\nSuppose the market rate\nhad fallen to 4% instead.\n\n00:02:13.110 --> 00:02:17.050\nA new bond would pay\nonly $40 a year, so your\n\n00:02:17.100 --> 00:02:21.040\n$50 is now the better deal by $10 a year.\n\n00:02:22.170 --> 00:02:25.930\nBuyers will pay extra\nfor that, and your bond\n\n00:02:25.980 --> 00:02:29.740\nsells for more than its\nface value at $1,044.52.\n\n00:02:31.297 --> 00:02:34.327\nRising rates are what happened\nto Dick's Sporting Goods lenders.\n\n00:02:35.277 --> 00:02:40.627\nTheir bonds pay 3.15% a\nyear, and that never changes.\n\n00:02:40.677 --> 00:02:44.457\nSince 2022, interest rates have risen, and\n\n00:02:44.507 --> 00:02:48.287\nlenders now want more than 3.15%.\n\n00:02:48.337 --> 00:02:52.207\nSo, the price fell to $920.91.\n\n00:02:53.397 --> 00:02:55.647\nDick's still pays exactly\nwhat it promised, and\n\n00:02:55.697 --> 00:02:57.947\nthe lenders holding the\nbonds took the loss.\n";
