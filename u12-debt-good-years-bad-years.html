<script>
  const cues = "WEBVTT\n\n00:00:00.300 --> 00:00:03.940\nPicture a food truck that\ncosts $100,000 to set up.\n\n00:00:04.790 --> 00:00:08.420\nIn a good year, it earns\n$20,000 of operating profit.\n\n00:00:08.850 --> 00:00:11.240\nThat's its profit before\npaying any interest.\n\n00:00:12.110 --> 00:00:14.840\nIn a bad year, maybe it earns only $4,000.\n\n00:00:15.850 --> 00:00:19.500\nThat's a year with a rainy\nspring when few people but want\n\n00:00:19.550 --> 00:00:21.000\nto buy lunch from an outdoor truck.\n\n00:00:21.750 --> 00:00:25.980\nThe owners can borrow part of\nthe $100,000 from a bank at 8%\n\n00:00:26.030 --> 00:00:29.000\na year, and they put in\nthe rest of the capital\n\n00:00:29.050 --> 00:00:30.440\nto start the truck themselves.\n\n00:00:31.490 --> 00:00:34.780\nSo how does the size of the loan\nchange what the owners earn?\n\n00:00:36.800 --> 00:00:39.430\nWell, the owners judge\nthe truck by their return\n\n00:00:39.480 --> 00:00:40.290\non their own money.\n\n00:00:41.320 --> 00:00:43.790\nOwner's return is operating\nprofit minus interest\n\n00:00:43.840 --> 00:00:45.090\ndivided by owner's money.\n\n00:00:46.060 --> 00:00:47.230\nStart with no loan at all.\n\n00:00:47.800 --> 00:00:49.570\nThe owners put in the whole $100,000,\n\n00:00:50.140 --> 00:00:51.390\nso there's no interest to pay.\n\n00:00:52.060 --> 00:00:58.450\nIn a good year, $20,000 divided\nby 100,000 is 0.2, or 20%.\n\n00:00:59.140 --> 00:01:03.470\nIn a bad year, 4,000\ndivided by 100,000 is 4%.\n\n00:01:04.160 --> 00:01:06.770\nNow, what if they borrowed $20,000?\n\n00:01:07.900 --> 00:01:09.750\nThe owners put in the other $80,000.\n\n00:01:10.640 --> 00:01:15.430\nThe interest is 20,000 times\n8%, which is $1,600 a year.\n\n00:01:15.760 --> 00:01:18.810\nThat interest is the same in\na good year or a bad year.\n\n00:01:18.980 --> 00:01:22.430\nThe bank gets its $1,600, sun or rain.\n\n00:01:22.700 --> 00:01:27.490\nIn the good year, 20,000 minus 1,600\n\n00:01:27.540 --> 00:01:29.870\nleaves 18,400.\n\n00:01:30.980 --> 00:01:33.670\nDivided by 80,000, that's 23%.\n\n00:01:34.300 --> 00:01:40.110\nIn the bad year, 4,000\nminus 1,600 leaves 2,400.\n\n00:01:41.340 --> 00:01:43.550\nDivided by 80,000, that's 3%.\n\n00:01:43.740 --> 00:01:45.410\nThe good year got a little better\n\n00:01:45.460 --> 00:01:47.510\nand the bad year got a little worse.\n\n00:01:48.360 --> 00:01:51.830\nNow, what if the food truck\nowners borrowed a lot of money,\n\n00:01:52.360 --> 00:01:52.890\n$80,000?\n\n00:01:53.740 --> 00:01:56.150\nThe owners put in only $20,000.\n\n00:01:57.200 --> 00:02:00.650\nThe interest is 80,000 times 8%,\n\n00:02:00.700 --> 00:02:05.670\nwhich is $6,400 of interest\nin a good year or a bad year.\n\n00:02:06.200 --> 00:02:12.810\nIn the good year, $20,000\nminus $6,400 leaves $13,600.\n\n00:02:13.940 --> 00:02:17.130\nDivided by the owners 20,000, that's 68%.\n\n00:02:18.120 --> 00:02:20.650\nIn the bad year, the truck earns $4,000\n\n00:02:20.700 --> 00:02:23.290\nbut still owns the bank $6,400.\n\n00:02:24.180 --> 00:02:29.430\n4,000 minus 6,400 is minus 2,400.\n\n00:02:30.260 --> 00:02:33.070\nDivided by 20,000, that's minus 12%.\n\n00:02:33.120 --> 00:02:35.410\nThe owners lose money and have to put up\n\n00:02:35.460 --> 00:02:37.330\nmore of their own money\njust to repay the bank.\n\n00:02:38.192 --> 00:02:41.642\nNow, what if we let the\namount of the loan move?\n\n00:02:42.392 --> 00:02:44.902\nThis chart shows the owner's\nreturn for every loan\n\n00:02:45.192 --> 00:02:47.122\nfrom zero to $80,000.\n\n00:02:47.732 --> 00:02:50.982\nAs the loan grows, the\ngood year return climbs\n\n00:02:51.032 --> 00:02:52.502\nand the bad year return sinks.\n\n00:02:53.312 --> 00:02:54.682\nThe two lines fan apart.\n\n00:02:55.392 --> 00:02:57.342\nThe bad year turns into a loss\n\n00:02:57.392 --> 00:02:59.382\nonce the loan passes $50,000.\n\n00:03:00.552 --> 00:03:03.882\nAt $50,000, the interest\nis 50,000 times 8%,\n\n00:03:03.932 --> 00:03:05.282\nwhich is 4,000.\n\n00:03:05.812 --> 00:03:07.702\nThat's everything we've\nassumed the truck earns\n\n00:03:07.752 --> 00:03:08.622\nin a bad year.\n\n00:03:09.283 --> 00:03:11.953\nWhy does more debt pull\nthe two years so far apart?\n\n00:03:12.563 --> 00:03:14.393\nFirst, the interest is the same\n\n00:03:14.443 --> 00:03:15.873\nin a good year and a bad one.\n\n00:03:16.403 --> 00:03:19.793\nThe 6,400 comes off the top, sun or rain.\n\n00:03:20.603 --> 00:03:22.793\nSecond, the owners put in less money,\n\n00:03:23.323 --> 00:03:25.773\nso each dollar of profit\nor loss counts for more.\n\n00:03:26.523 --> 00:03:29.013\nWith no loan, the owners make $20,000\n\n00:03:29.103 --> 00:03:31.013\non 100,000 of their own money.\n\n00:03:32.003 --> 00:03:36.893\nWith the $80,000 loan,\nthey make only $13,600,\n\n00:03:37.643 --> 00:03:40.433\nbut they've only put up\n$20,000 of their own money.\n\n00:03:40.963 --> 00:03:43.533\nThat's fewer dollars, but\non a fifth of the money,\n\n00:03:43.663 --> 00:03:46.653\nso the return jumps from 20% to 68%,\n\n00:03:46.703 --> 00:03:48.793\nand the owners could have deployed\n\n00:03:48.843 --> 00:03:51.493\ntheir other $80,000 wherever they wanted,\n\n00:03:51.923 --> 00:03:53.793\ninto the stock market or another business.\n\n00:03:54.323 --> 00:03:56.273\nThat's how borrowing\nmakes a good year better\n\n00:03:56.323 --> 00:03:57.693\nand a bad year worse.\n";
